version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: vm1-nginx
    ports:
      - "80:80"
      - "443:443"
      # stub_status for nginx-prometheus-exporter. The host loopback prefix is
      # required: without it Docker publishes 8080 on every interface and the
      # metrics listener becomes reachable from outside VM1.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./client/dist:/usr/share/nginx/html/client:ro
      - ./playground/dist:/usr/share/nginx/html/playground:ro
      - ./admin/dist:/usr/share/nginx/html/bifrost-admin:ro
      - /opt/bnbong/ambiw:/usr/share/nginx/html/ambiw:ro
      - /opt/bnbong/overlock:/usr/share/nginx/html/overlock:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    restart: unless-stopped
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge
