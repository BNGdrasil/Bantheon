name: CD (VM1 nginx config)

# Nginx 설정과 Compose 파일을 VM1에 적용한다. 정적 파일 배포와 달리 컨테이너를
# 재생성하고 reload까지 수행하므로, 자동 실행하지 않고 수동 실행만 허용한다.
# 절차는 docs/nginx-baseline.md 6절을 따르며, 서버 측 구현은
# scripts/vm1-apply-nginx.sh 에 있다.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'smoke test에 사용할 apex 도메인'
        required: false
        default: 'bnbong.com'

permissions:
  contents: read

jobs:
  deploy:
    name: Apply nginx config on VM1
    runs-on: ubuntu-latest
    environment: production
    # 정적 배포와 같은 그룹을 써서 VM1을 동시에 고치는 실행을 직렬화한다.
    concurrency:
      group: vm1-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VM1_HOST: ${{ secrets.VM1_HOST }}
      DOMAIN_NAME: ${{ github.event.inputs.domain || 'bnbong.com' }}
      STAGE_DIR: /opt/bnbong/nginx.next

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Configure SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.VM1_SSH_PRIVATE_KEY }}
        SSH_KNOWN_HOSTS: ${{ secrets.VM1_SSH_KNOWN_HOSTS }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - name: Upload config to staging directory
      run: |
        set -euo pipefail
        # staging 디렉터리를 비우고 다시 만든다. 운영 경로는 아직 건드리지 않으며,
        # 교체는 서버 측 스크립트가 선검증을 통과한 뒤에 수행한다.
        ssh -i ~/.ssh/id_deploy "ubuntu@${VM1_HOST}" \
          "rm -rf '${STAGE_DIR}' && mkdir -p '${STAGE_DIR}/snippets'"
        # snippets를 먼저 올려야 include 대상이 빠진 상태로 검사되지 않는다.
        rsync -az --delete -e "ssh -i $HOME/.ssh/id_deploy" \
          nginx/snippets/ "ubuntu@${VM1_HOST}:${STAGE_DIR}/snippets/"
        rsync -az -e "ssh -i $HOME/.ssh/id_deploy" \
          nginx/nginx.conf docker-compose.yml "ubuntu@${VM1_HOST}:${STAGE_DIR}/"
        ssh -i ~/.ssh/id_deploy "ubuntu@${VM1_HOST}" "ls -la '${STAGE_DIR}'"

    - name: Apply config on VM1
      run: |
        set -euo pipefail
        ssh -i ~/.ssh/id_deploy "ubuntu@${VM1_HOST}" \
          "sudo /opt/bnbong/scripts/vm1-apply-nginx.sh"

    - name: Smoke test (vhosts)
      run: |
        set -euo pipefail
        failed=0

        hosts="
        ${DOMAIN_NAME}
        www.${DOMAIN_NAME}
        dashboard.${DOMAIN_NAME}
        api.${DOMAIN_NAME}
        admin.${DOMAIN_NAME}
        monitoring.${DOMAIN_NAME}
        ambiw.${DOMAIN_NAME}
        overlock.${DOMAIN_NAME}
        "

        for host in $hosts; do
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://${host}/" || echo 000)"
          case "$code" in
            2??|3??|401|403)
              echo "  https://${host}/ -> $code"
              ;;
            *)
              echo "::error::https://${host}/ -> $code"
              failed=1
              ;;
          esac
        done

        if [ "$failed" -ne 0 ]; then
          echo "::error::일부 도메인이 정상 응답하지 않았습니다."
          exit 1
        fi

    - name: Smoke test (admin SPA deep link headers)
      run: |
        set -euo pipefail
        # SPA fallback 경로가 index.html을 돌려주면서 재검증 헤더와 보안 헤더를
        # 함께 내보내는지 확인한다. 기준선 문서 6절 9번에 해당하는 검사다.
        url="https://admin.${DOMAIN_NAME}/deploy-smoke-$(date +%s)"
        headers="$(curl -sSI --max-time 15 "$url" || true)"
        printf '%s\n' "$headers"

        failed=0
        for pattern in '^cache-control:.*no-cache' '^x-frame-options:' '^x-content-type-options:'; do
          if ! printf '%s' "$headers" | grep -qiE "$pattern"; then
            echo "::error::admin SPA 딥링크 응답에 기대한 헤더가 없습니다: $pattern"
            failed=1
          fi
        done

        if [ "$failed" -ne 0 ]; then
          echo "::error::헤더 회귀가 발견되었습니다. 스크립트가 출력한 백업 경로로 되돌릴 수 있습니다."
          exit 1
        fi

    - name: Remove SSH key
      if: always()
      run: rm -f ~/.ssh/id_deploy
