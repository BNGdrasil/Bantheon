name: CI

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]

# Least privilege: the build only needs to read the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        app: [client, admin]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        # Node 18 reached end of life; 22 is the supported LTS line.
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ${{ matrix.app }}/package-lock.json

    - name: Install dependencies (${{ matrix.app }})
      working-directory: ./${{ matrix.app }}
      run: npm ci

    # Lint runs before the build so a style or hook violation is reported on
    # its own instead of being hidden behind a compile error.
    - name: Lint (${{ matrix.app }})
      working-directory: ./${{ matrix.app }}
      run: npm run lint

    # Only the admin console has a test suite. The step is skipped for the
    # client rather than made conditional inside a script, so a missing run is
    # visible in the job summary instead of passing silently.
    - name: Test (${{ matrix.app }})
      if: matrix.app == 'admin'
      working-directory: ./${{ matrix.app }}
      run: npm test

    - name: Build (${{ matrix.app }})
      working-directory: ./${{ matrix.app }}
      run: npm run build

    # The artifact name carries the commit SHA so a static release can be
    # identified and rolled back by revision instead of by build order.
    - name: Upload build artifacts (${{ matrix.app }})
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.app }}-dist-${{ github.sha }}
        path: ${{ matrix.app }}/dist/
        retention-days: 30
        if-no-files-found: error

    # The smoke test drives the built bundle in a browser against a local mock
    # gateway, so only the browser has to be fetched here. Chromium alone: the
    # suite declares no other project, and installing the rest would add
    # minutes for engines nothing runs on.
    - name: Install Playwright chromium (${{ matrix.app }})
      if: matrix.app == 'admin'
      working-directory: ./${{ matrix.app }}
      run: npx playwright install --with-deps chromium

    # The suite rebuilds the console into dist-e2e/ with the mock addresses
    # injected, which is why it runs after the artifact above has been
    # uploaded: the dist/ that ships is never the one pointing at a mock.
    - name: End-to-end smoke test (${{ matrix.app }})
      if: matrix.app == 'admin'
      working-directory: ./${{ matrix.app }}
      run: npm run test:e2e

    # Screenshots and traces are only written for a test that failed, so this
    # step has nothing to collect after a green run and is skipped entirely.
    - name: Upload e2e diagnostics (${{ matrix.app }})
      if: failure() && matrix.app == 'admin'
      uses: actions/upload-artifact@v6
      with:
        name: admin-e2e-report-${{ github.sha }}
        path: |
          admin/playwright-report/
          admin/e2e-results/
        retention-days: 7
        if-no-files-found: ignore
