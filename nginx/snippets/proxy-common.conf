# Shared proxy parameters for upstreams reached through this Nginx.
#
# X-Real-IP / X-Forwarded-For are derived from $remote_addr, which the
# real_ip module in nginx.conf rewrites to the CF-Connecting-IP value for
# connections coming from the trusted Cloudflare ranges. A direct
# connection keeps its own peer address and cannot forge the header.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# These match the nginx built-in defaults. They are stated explicitly so
# every proxied location documents the same timeout budget.
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
