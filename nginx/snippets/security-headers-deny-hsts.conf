# Security headers for the TLS-terminating vhosts that deny framing.
# Same values as the production baseline, HSTS included.
#
# See the note in security-headers-deny.conf: any location with its own
# add_header must include this file to keep these headers.
add_header X-Frame-Options DENY;
add_header X-Content-Type-Options nosniff;
add_header X-XSS-Protection "1; mode=block";
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
