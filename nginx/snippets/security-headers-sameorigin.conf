# Security headers for the overlock HTTP vhost, which allows same-origin
# framing and adds a referrer policy. Values match the production baseline.
#
# See the note in security-headers-deny.conf: any location with its own
# add_header must include this file to keep these headers.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
