# Variant for vhosts that forward the Cloudflare visitor address verbatim
# instead of the connection peer. Kept separate from proxy-common.conf so
# the rendered configuration stays identical to the production baseline.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $http_cf_connecting_ip;
proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
proxy_set_header X-Forwarded-Proto $scheme;

# Same explicit defaults as proxy-common.conf.
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
