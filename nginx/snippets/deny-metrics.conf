# Keep the Prometheus scrape endpoint off the public vhosts.
#
# Bifrost, Bidar and Grafana all expose /metrics without authentication, and
# Prometheus scrapes them from inside the VM2 docker network, so the endpoint
# never has to be reachable through a public hostname. 404 is returned instead
# of 403 so the response does not confirm that the endpoint exists.
#
# Matching notes (nginx location priority):
#   * "= /metrics" wins over every prefix and regex location, so the include
#     position inside a server block does not matter for the exact path.
#   * "^~ /metrics/" wins over regex locations as well and covers the trailing
#     slash form plus anything an exporter might publish below it.
#   * nginx decodes percent escapes, collapses "//" and resolves "." and ".."
#     before matching, so /%6Detrics, //metrics and /a/../metrics all arrive
#     here as /metrics.
#   * The case-insensitive regex is the only line whose include position
#     matters, because regex locations are tried in the order they appear.
#     Include this file near the top of a server block. The current backends
#     route case-sensitively, so the line only guards against a future upstream
#     that does not.
location = /metrics {
    return 404;
}

location ^~ /metrics/ {
    return 404;
}

location ~* ^/metrics(/|$) {
    return 404;
}
