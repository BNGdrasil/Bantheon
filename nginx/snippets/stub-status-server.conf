# Loopback-only stub_status listener for nginx-prometheus-exporter.
#
# The exporter runs on the VM1 host as a systemd unit and scrapes
# http://127.0.0.1:8080/stub_status. Its install definition lives in
# baedalus at monitoring/remote-exporters/install-nginx-exporter.sh.
#
# This file declares a whole server block, unlike the other snippets in this
# directory, and is therefore included from the http level of nginx.conf
# rather than from inside a server block.
#
# Why 8080 and not 80 or 443:
#   * VM1 runs nginx as the vm1-nginx container, so the public 80 and 443
#     listeners are published on every interface. A path on those listeners
#     would be reachable through Cloudflare.
#   * 8080 is published as "127.0.0.1:8080:8080" in docker-compose.yml, so the
#     host loopback is the only way in from outside the container.
#   * Nothing else on VM1 binds 8080. The 8080 in docs/development.md belongs
#     to the local development ingress on a workstation, not to VM1.
#
# Why the allow list is wider than 127.0.0.1:
#   Docker does not DNAT a port published on 127.0.0.1; the userland
#   docker-proxy relays it instead, so the connection reaches this server with
#   the bridge gateway address of bnbong_frontend-network as its source, not
#   with 127.0.0.1. That gateway address is assigned by Docker and is not
#   recorded anywhere, so the allow list covers the Docker bridge pool
#   (172.16.0.0/12) instead of a single address. See docs/nginx.md for the
#   command that reads the real gateway address and for how to narrow this
#   list once operations has confirmed it.
#
# cloudflare-real-ip.conf sits at the http level and therefore also applies
# here, but it rewrites $remote_addr only for connections coming from a
# Cloudflare edge range. The gateway address is not in those ranges, so a
# forged CF-Connecting-IP header cannot move a request past the allow list.
server {
    listen 8080;
    server_name _;

    # Declared at the server level so a location added later inherits it
    # instead of having to repeat it. A source outside the allow list gets 403
    # on /stub_status. The catch-all below still answers 404 to that source,
    # because "return" runs in the rewrite phase, before the access phase; the
    # 404 reveals nothing, so the ordering is left alone.
    allow 127.0.0.1;
    allow 172.16.0.0/12;
    deny all;

    # stub_status reports active connections and cumulative request counts.
    # It carries no request paths, no hostnames and no client addresses.
    location = /stub_status {
        stub_status;
        access_log off;
    }

    location / {
        return 404;
    }
}
