# Security headers for the HTTP (port 80) vhosts that sit behind Cloudflare.
# HSTS is intentionally absent here; only the TLS-terminating vhosts send it.
#
# nginx's add_header directives are NOT inherited by a location that declares
# an add_header of its own, so every location that sets a header must include
# this file as well or the response loses its security headers.
add_header X-Frame-Options DENY;
add_header X-Content-Type-Options nosniff;
add_header X-XSS-Protection "1; mode=block";
