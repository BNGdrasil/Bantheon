events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        application/wasm
        image/svg+xml;

    types { application/wasm wasm; }

    # Trust only Cloudflare for the client address (SEC-04).
    # Placement is a readability choice, not a requirement: the real_ip module
    # rewrites $remote_addr while the request is being processed, which happens
    # before limit_req evaluates $binary_remote_addr regardless of the order in
    # which the directives appear in this file.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # ============================================
    # Upstream servers - VM2 (Core API host)
    #
    # Every upstream below points at the same VM2 private address
    # (10.0.1.60). Changing the host means editing this block only; no
    # server block refers to a literal address.
    # ============================================
    upstream gateway {
        server 10.0.1.60:8000;
    }

    upstream auth_server {
        server 10.0.1.60:8001;
    }

    upstream overlock_server {
        server 10.0.1.60:8010;
    }

    upstream grafana {
        server 10.0.1.60:3000;
    }

    # ============================================
    # HTTP server blocks - Redirect to HTTPS or handle Cloudflare proxy
    # ============================================

    # HTTP for the public client site (Cloudflare handles HTTPS, so we accept HTTP)
    # dashboard.bnbong.com is the address currently in production; the apex
    # names come from the local "move to bnbong.com" change and are served by
    # the same root.
    server {
        listen 80;
        server_name bnbong.com www.bnbong.com dashboard.bnbong.com;

        # Root directory for client static files
        root /usr/share/nginx/html/client;
        index index.html;

        # Security headers
        include /etc/nginx/snippets/security-headers-deny.conf;

        # Hashed build output (Vite writes content-hashed names under /assets/).
        # "^~" keeps the regex location below from taking these requests.
        location ^~ /assets/ {
            include /etc/nginx/snippets/static-immutable.conf;
            include /etc/nginx/snippets/security-headers-deny.conf;
        }

        # HTML shell - revalidate so a redeploy is picked up at once.
        location = /index.html {
            include /etc/nginx/snippets/static-revalidate.conf;
            try_files /index.html =404;
        }

        # Unhashed static files - revalidate instead of caching for a year.
        location ~* \.(html|js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            include /etc/nginx/snippets/static-revalidate.conf;
        }

        # Portfolio site (static files)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # HTTP for api.bnbong.com
    server {
        listen 80;
        server_name api.bnbong.com;

        # Security headers
        include /etc/nginx/snippets/security-headers-deny.conf;

        # Prometheus endpoint of the gateway and the auth server (see snippet)
        include /etc/nginx/snippets/deny-metrics.conf;

        # API Gateway with rate limiting
        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://gateway;
            include /etc/nginx/snippets/proxy-common-cf.conf;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-Ray $http_cf_ray;
        }

        # Auth endpoints (direct access if needed)
        location /auth {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://auth_server;
            include /etc/nginx/snippets/proxy-common-cf.conf;
        }
    }

    # HTTP for admin.bnbong.com (Bifrost Admin Dashboard)
    server {
        listen 80;
        server_name admin.bnbong.com;

        # Root directory for bifrost admin static files
        root /usr/share/nginx/html/bifrost-admin;
        index index.html;

        # Security headers
        include /etc/nginx/snippets/security-headers-deny.conf;

        # This vhost proxies /admin/api/ to the gateway, so it keeps the same
        # block as api.bnbong.com. /metrics is not an admin console route.
        include /etc/nginx/snippets/deny-metrics.conf;

        # Explicit index.html handling (prevents redirect loop) and revalidation
        location = /index.html {
            include /etc/nginx/snippets/static-revalidate.conf;
            try_files /index.html =404;
        }

        # Admin API proxy to VM2 Gateway
        location /admin/api/ {
            proxy_pass http://gateway/admin/api/;
            include /etc/nginx/snippets/proxy-common.conf;
        }

        # Hashed build output
        location ^~ /assets/ {
            include /etc/nginx/snippets/static-immutable.conf;
            include /etc/nginx/snippets/security-headers-deny.conf;
        }

        # Unhashed static files
        location ~* \.(html|js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            include /etc/nginx/snippets/static-revalidate.conf;
        }

        # Admin dashboard (static files) - must come last.
        # /index.html must be the LAST argument so try_files issues an internal
        # redirect and the request re-enters "location = /index.html". With a
        # trailing "=404" nginx treats /index.html as a plain file probe and the
        # revalidation and security headers of that block are never applied.
        # A missing index.html still returns 404 through that block.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # HTTP for monitoring.bnbong.com (Grafana)
    server {
        listen 80;
        server_name monitoring.bnbong.com;

        # Grafana's own /metrics. /api/health stays reachable for smoke tests.
        include /etc/nginx/snippets/deny-metrics.conf;

        # Grafana proxy to VM2
        location / {
            proxy_pass http://grafana;
            include /etc/nginx/snippets/proxy-common.conf;
            include /etc/nginx/snippets/proxy-websocket.conf;
        }
    }

    # ambiw
    server {
        listen 80;
        server_name ambiw.bnbong.com;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name ambiw.bnbong.com;

        ssl_certificate /etc/ssl/cloudflare/cert.pem;
        ssl_certificate_key /etc/ssl/cloudflare/key.pem;

        root /usr/share/nginx/html/ambiw/current;
        index index.html;

        # Vite 해시된 asset은 1년 캐시
        location ^~ /assets/ {
            include /etc/nginx/snippets/static-immutable.conf;
        }

        # 해시가 없는 로더 문서는 재검증한다.
        location = /index.html {
            include /etc/nginx/snippets/static-revalidate.conf;
            try_files /index.html =404;
        }

        # SPA fallback (Three.js 앱이 react-router 쓰는 경우 대비)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 80;
        server_name overlock.bnbong.com;

        # Cloudflare 가 TLS 를 종료하고 HTTP:80 으로 넘긴다(오렌지 클라우드).
        root /usr/share/nginx/html/overlock;
        index index.html;

        # 기존 보안 헤더 톤 유지.
        include /etc/nginx/snippets/security-headers-sameorigin.conf;

        # 이 vhost 도 /api/ 를 vm2 백엔드로 넘기므로 같은 차단을 적용한다.
        include /etc/nginx/snippets/deny-metrics.conf;

        # --- API: vm2 로 프록시 ---
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            client_max_body_size 16k;

            proxy_pass http://overlock_server;
            # CF 뒤라 실제 클라이언트 IP 는 CF-Connecting-IP 로 들어온다.
            include /etc/nginx/snippets/proxy-common-cf.conf;
        }

        # --- 정적: Godot 웹 빌드(build/web) ---
        # 로더 셸(문서)은 캐시 금지 → 재배포가 바로 반영된다.
        # nginx 는 location 에 add_header 가 하나라도 있으면 상위 add_header 를 물려받지
        # 않으므로, 문서 응답이 보안 헤더를 잃지 않게 여기서 다시 명시한다.
        location = /index.html {
            include /etc/nginx/snippets/security-headers-sameorigin.conf;
            add_header Cache-Control "no-cache" always;
        }

        # 엔진·리소스(.wasm/.pck/.js)는 파일명이 고정이라 7일 캐시.
        # 재배포로 내용이 바뀌면 Cloudflare Purge 로 무효화한다(7-3).
        location ~* \.(wasm|pck|js)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            include /etc/nginx/snippets/security-headers-sameorigin.conf;
        }

        # Godot 은 단일 페이지라 SPA fallback 이 필요 없다. 없는 경로는 404.
        location / {
            try_files $uri =404;
        }
    }

    # ============================================
    # HTTPS server blocks with Cloudflare Origin Certificate
    # ============================================

    # HTTPS for the public client site
    server {
        listen 443 ssl;
        http2 on;
        server_name bnbong.com www.bnbong.com dashboard.bnbong.com;

        # Cloudflare Origin Certificate
        ssl_certificate /etc/ssl/cloudflare/cert.pem;
        ssl_certificate_key /etc/ssl/cloudflare/key.pem;

        # SSL settings (Mozilla Intermediate configuration)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Root directory for client static files
        root /usr/share/nginx/html/client;
        index index.html;

        # Security headers
        include /etc/nginx/snippets/security-headers-deny-hsts.conf;

        # Hashed build output
        location ^~ /assets/ {
            include /etc/nginx/snippets/static-immutable.conf;
            include /etc/nginx/snippets/security-headers-deny-hsts.conf;
        }

        # HTML shell - revalidate
        location = /index.html {
            include /etc/nginx/snippets/static-revalidate.conf;
            try_files /index.html =404;
        }

        # Unhashed static files
        location ~* \.(html|js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            include /etc/nginx/snippets/static-revalidate.conf;
        }

        # Portfolio site (static files)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # HTTPS for api.bnbong.com
    server {
        listen 443 ssl;
        http2 on;
        server_name api.bnbong.com;

        # Cloudflare Origin Certificate
        ssl_certificate /etc/ssl/cloudflare/cert.pem;
        ssl_certificate_key /etc/ssl/cloudflare/key.pem;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        include /etc/nginx/snippets/security-headers-deny-hsts.conf;

        # Prometheus endpoint of the gateway and the auth server (see snippet)
        include /etc/nginx/snippets/deny-metrics.conf;

        # API Gateway with rate limiting
        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://gateway;
            include /etc/nginx/snippets/proxy-common-cf.conf;
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_set_header CF-Ray $http_cf_ray;
        }

        # Auth endpoints (direct access if needed)
        location /auth {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://auth_server;
            include /etc/nginx/snippets/proxy-common-cf.conf;
        }
    }

    # HTTPS for admin.bnbong.com (Bifrost Admin Dashboard)
    server {
        listen 443 ssl;
        http2 on;
        server_name admin.bnbong.com;

        # Cloudflare Origin Certificate
        ssl_certificate /etc/ssl/cloudflare/cert.pem;
        ssl_certificate_key /etc/ssl/cloudflare/key.pem;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Root directory for bifrost admin static files
        root /usr/share/nginx/html/bifrost-admin;
        index index.html;

        # Security headers
        include /etc/nginx/snippets/security-headers-deny-hsts.conf;

        # This vhost proxies /admin/api/ to the gateway, so it keeps the same
        # block as api.bnbong.com. /metrics is not an admin console route.
        include /etc/nginx/snippets/deny-metrics.conf;

        # Explicit index.html handling (prevents redirect loop) and revalidation
        location = /index.html {
            include /etc/nginx/snippets/static-revalidate.conf;
            try_files /index.html =404;
        }

        # Admin API proxy to VM2 Gateway
        location /admin/api/ {
            proxy_pass http://gateway/admin/api/;
            include /etc/nginx/snippets/proxy-common.conf;
        }

        # Hashed build output
        location ^~ /assets/ {
            include /etc/nginx/snippets/static-immutable.conf;
            include /etc/nginx/snippets/security-headers-deny-hsts.conf;
        }

        # Unhashed static files
        location ~* \.(html|js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            include /etc/nginx/snippets/static-revalidate.conf;
        }

        # Admin dashboard (static files) - must come last.
        # /index.html must be the LAST argument so try_files issues an internal
        # redirect and the request re-enters "location = /index.html". With a
        # trailing "=404" nginx treats /index.html as a plain file probe and the
        # revalidation and security headers of that block are never applied.
        # A missing index.html still returns 404 through that block.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # HTTPS for monitoring.bnbong.com (Grafana)
    server {
        listen 443 ssl;
        http2 on;
        server_name monitoring.bnbong.com;

        # Cloudflare Origin Certificate
        ssl_certificate /etc/ssl/cloudflare/cert.pem;
        ssl_certificate_key /etc/ssl/cloudflare/key.pem;

        # SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers (Grafana 전용)
        add_header X-Frame-Options SAMEORIGIN;  # Grafana iframe 지원
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Grafana's own /metrics. /api/health stays reachable for smoke tests.
        include /etc/nginx/snippets/deny-metrics.conf;

        # Grafana proxy to VM2
        location / {
            proxy_pass http://grafana;
            include /etc/nginx/snippets/proxy-common.conf;
            include /etc/nginx/snippets/proxy-websocket.conf;
        }
    }

    # HTTPS for overlock.bnbong.com (Overlock web game + leaderboard API)
    server {
        listen 443 ssl;
        http2 on;
        server_name overlock.bnbong.com;

        # Cloudflare Origin Certificate
        ssl_certificate /etc/ssl/cloudflare/cert.pem;
        ssl_certificate_key /etc/ssl/cloudflare/key.pem;

        # SSL settings (Mozilla Intermediate configuration)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Root directory for game static files
        root /usr/share/nginx/html/overlock;
        index index.html;

        # Security headers
        include /etc/nginx/snippets/security-headers-deny-hsts.conf;

        # This vhost also proxies /api/ to a VM2 backend, so it gets the same
        # block as the :80 twin.
        include /etc/nginx/snippets/deny-metrics.conf;

        # Leaderboard API proxy to VM2 (overlock server)
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            client_max_body_size 16k;

            proxy_pass http://overlock_server;
            include /etc/nginx/snippets/proxy-common-cf.conf;
        }

        # Game entry point - always revalidate (fixed filenames, see cache note)
        # NOTE: add_header in a location cancels inherited server-level headers,
        #       so security headers are re-declared here.
        location = /index.html {
            add_header Cache-Control "no-cache";
            include /etc/nginx/snippets/security-headers-deny-hsts.conf;
            try_files /index.html =404;
        }

        # Game assets (fixed names like index.wasm/index.pck - moderate cache, purge CF on redeploy)
        location ~* \.(wasm|pck|js|png)$ {
            expires 7d;
            add_header Cache-Control "public";
            include /etc/nginx/snippets/security-headers-deny-hsts.conf;
        }

        # Static files
        location / {
            try_files $uri $uri/ =404;
        }
    }

    # ============================================
    # Metrics listener (loopback only, not published to the internet)
    #
    # A separate server on 8080 so that stub_status never shares a listener
    # with a public vhost. The snippet declares the whole server block.
    # ============================================
    include /etc/nginx/snippets/stub-status-server.conf;

    # ============================================
    # Default server block (reject unknown hosts)
    # ============================================
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        # Dummy SSL certificate for default server
        ssl_certificate /etc/ssl/cloudflare/cert.pem;
        ssl_certificate_key /etc/ssl/cloudflare/key.pem;

        return 444;
    }
}
